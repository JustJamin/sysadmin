# SSH hardening for lenovo — key-only login, no root, only jamin.
# Drop-ins are read before the rest of sshd_config and first value wins, so these override it.
# Undo: sudo rm /etc/ssh/sshd_config.d/10-hardening.conf && sudo systemctl reload ssh
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
PermitEmptyPasswords no
PubkeyAuthentication yes
AuthenticationMethods publickey
AllowUsers jamin
MaxAuthTries 3
LoginGraceTime 30
X11Forwarding no
